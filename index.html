<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>半场单挑</title>
    <link rel="stylesheet" href="./style.css" />

    <!--
      Catches whatever the game throws and hands it to the preview panel when
      it asks. Keep it first, and keep it a plain script: it can only report a
      syntax error in a file that has not been compiled yet, so anything that
      loads before it fails silently.
    -->
    <script src="./report.js"></script>

    <!--
      Bare module specifiers, resolved in the browser.

      There is no bundler and no node_modules here, so "three" would normally be
      an unresolvable import. This map is what makes it resolve — and it has to
      stay in this file, because an import map only applies to the document that
      declares it, and it must appear before the first module that relies on it.

      `three/addons/` covers everything under examples/jsm: OrbitControls,
      GLTFLoader, EffectComposer and the rest. The engine modules import through
      both prefixes, so removing this breaks every one of them.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="arena" aria-label="半场篮球场"></main>
    <header class="scoreboard" aria-label="比分板">
      <h1>半场单挑</h1>
      <div><span>得分</span><strong id="score">0</strong></div>
      <div><span>回合</span><strong id="round">1 / 10</strong></div>
      <div><span>进攻时间</span><strong id="clock">12.0</strong></div>
      <div><span>命中率</span><strong id="accuracy">—</strong></div>
    </header>
    <div id="callout" role="status"></div>
    <div id="dunk-hint" hidden><span class="dunk-key"><kbd>空格</kbd> </span>可扣篮</div>
    <div id="meter" hidden aria-label="投篮时机">
      <span id="shot-type"></span>
      <div class="track"><i class="green"></i><i id="needle"></i></div>
    </div>
    <section id="menu">
      <div>
        <h2 id="menu-title">挑战陪练机器人</h2>
        <p id="summary">10 个进攻回合，每回合 12 秒。拉开空间，在绿色区域松开空格出手。</p>
        <label class="difficulty-setting" for="difficulty">
          <span>难度</span>
          <select id="difficulty">
            <option value="easy">简单</option>
            <option value="normal" selected>标准</option>
            <option value="hard">困难 · 高个长臂</option>
          </select>
        </label>
        <button id="start" type="button">开始挑战</button>
      </div>
    </section>
    <footer><span><kbd>WASD</kbd> 移动</span><span>左右移动自动换手</span><span><kbd>J</kbd> 胯下</span><span><kbd>K</kbd> 转身</span><span><kbd id="dash-key">L</kbd> 加速</span><span><kbd>B</kbd> 背打</span><span><kbd>F</kbd> 投篮假动作</span><span><kbd>空格</kbd> 按住起跳 · 松开投篮</span><span><kbd>V</kbd> 切换视角</span><span><kbd>R</kbd> 重开</span></footer>
    <div id="camera-options" role="group" aria-label="镜头视角，快捷键 V">
      <button id="third-person" type="button" aria-pressed="true">第三人称</button>
      <button id="first-person" type="button" aria-pressed="false">第一人称</button>
    </div>
    <div class="touch-controls">
      <span>左半屏拖动</span>
      <button id="between" type="button">胯下</button>
      <button id="spin" type="button">转身</button>
      <button id="dash" type="button">加速</button>
      <button id="post" type="button" aria-pressed="false">背打</button>
      <button id="fake" type="button">假投</button>
      <button id="shoot" type="button">投篮</button>
    </div>
    <script type="module" src="./basketball.js"></script>
  </body>
</html>
